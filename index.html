
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion de Cantine Scolaire</title>
<style>
body{font-family:Arial;background:#f0f5f1;margin:0;padding:12px;color:#183b2b}
header{background:#087b45;color:white;text-align:center;padding:20px;border-radius:12px}
h1{font-size:23px}
h2{color:#087b45}
input{width:65px;padding:10px;border:1px solid #aaa;border-radius:7px;text-align:center;font-size:17px}
table{width:100%;border-collapse:collapse;background:white;margin:12px 0}
th,td{border:1px solid #ccc;padding:9px;text-align:center}
th{background:#087b45;color:white}
.total{background:#d9f4e2;font-weight:bold}
.resultat{background:#087b45;color:white;padding:15px;border-radius:10px;margin-top:15px}
button{background:#087b45;color:white;border:0;padding:12px;border-radius:8px;font-size:16px;margin:5px}
</style>
</head>
<body>
<header>
<h1>GESTION DE CANTINE SCOLAIRE</h1>
<p>Suivi des rationnaires par classe et par genre</p>
</header>

<h2>Date de gestion</h2>
<input type="date" id="date" style="width:180px">

<h2>Effectif des rationnaires</h2>
<p>Prix d'une ration : <b>25 F CFA</b></p>

<table>
<thead>
<tr>
<th>Classe</th>
<th>Garçons</th>
<th>Filles</th>
<th>Total</th>
</tr>
</thead>
<tbody id="corps"></tbody>
<tfoot>
<tr class="total">
<td>TOTAL</td>
<td id="tg">0</td>
<td id="tf">0</td>
<td id="tt">0</td>
</tr>
</tfoot>
</table>

<div class="resultat">
<h2 style="color:white">BILAN DE LA CANTINE</h2>
<p>Total garçons : <b id="bg">0</b></p>
<p>Total filles : <b id="bf">0</b></p>
<p>Total rationnaires : <b id="br">0</b></p>
<h2 style="color:white">RECETTE TOTALE</h2>
<h1 id="argent">0 F CFA</h1>
</div>

<button onclick="sauver()">Enregistrer la journée</button>
<button onclick="charger()">Charger la journée</button>
<button onclick="window.print()">Imprimer le bilan</button>

<script>
const classes=["CP1","CP2","CE1","CE2","CM1","CM2"];
const prix=25;
const corps=document.getElementById("corps");

classes.forEach((c,i)=>{
let tr=document.createElement("tr");
tr.innerHTML=`
<td><b>${c}</b></td>
<td><input type="number" min="0" value="0" id="g${i}"></td>
<td><input type="number" min="0" value="0" id="f${i}"></td>
<td id="t${i}">0</td>`;
corps.appendChild(tr);
});

function calculer(){
let g=0,f=0;
classes.forEach((c,i)=>{
let a=Math.max(0,Number(document.getElementById("g"+i).value)||0);
let b=Math.max(0,Number(document.getElementById("f"+i).value)||0);
document.getElementById("t"+i).textContent=a+b;
g+=a;f+=b;
});
let total=g+f;
document.getElementById("tg").textContent=g;
document.getElementById("tf").textContent=f;
document.getElementById("tt").textContent=total;
document.getElementById("bg").textContent=g;
document.getElementById("bf").textContent=f;
document.getElementById("br").textContent=total;
document.getElementById("argent").textContent=(total*prix).toLocaleString("fr-FR")+" F CFA";
}
classes.forEach((c,i)=>{
document.getElementById("g"+i).addEventListener("input",calculer);
document.getElementById("f"+i).addEventListener("input",calculer);
});
function sauver(){
let donnees={};
classes.forEach((c,i)=>{
donnees["g"+i]=document.getElementById("g"+i).value;
donnees["f"+i]=document.getElementById("f"+i).value;
});
localStorage.setItem("cantine_"+document.getElementById("date").value,JSON.stringify(donnees));
alert("Journée enregistrée !");
}
function charger(){
let d=localStorage.getItem("cantine_"+document.getElementById("date").value);
if(!d){alert("Aucune journée enregistrée pour cette date.");return;}
let donnees=JSON.parse(d);
classes.forEach((c,i)=>{
document.getElementById("g"+i).value=donnees["g"+i];
document.getElementById("f"+i).value=donnees["f"+i];
});
calculer();
}
document.getElementById("date").value=new Date().toISOString().slice(0,10);
calculer();
</script>
</body>
</html>
